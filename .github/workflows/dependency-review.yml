name: dependency-review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    # Private repositories require GitHub Advanced Security. Set the repository
    # variable ENABLE_DEPENDENCY_REVIEW=true after enabling it.
    if: github.event.repository.visibility == 'public' || vars.ENABLE_DEPENDENCY_REVIEW == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
